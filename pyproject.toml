[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppe-detection-service"
version = "0.2.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.18", "Pillow>=11,<13"]

[project.optional-dependencies]
vision = ["ultralytics>=8.3,<9", "onnx>=1.17,<2", "onnxruntime>=1.20,<2"]
vlm = ["transformers>=4.49,<5", "accelerate>=1,<2", "torch>=2.5", "torchvision>=0.20"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["ppe*"]

[tool.setuptools.package-data]
ppe = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
